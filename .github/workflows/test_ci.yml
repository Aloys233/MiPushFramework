name: Test CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK Platform 37
      run: |
        export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
        SDKMANAGER=$(which sdkmanager 2>/dev/null || find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n 1)
        if [ -z "$SDKMANAGER" ]; then
          echo "sdkmanager not found in $ANDROID_HOME"
          exit 1
        fi
        echo "Using sdkmanager: $SDKMANAGER"
        yes | "$SDKMANAGER" --licenses 2>/dev/null || true
        "$SDKMANAGER" "platforms;android-37.0"
        if [ -d "$ANDROID_HOME/platforms/android-37.0" ]; then
          rm -rf "$ANDROID_HOME/platforms/android-37"
          mv "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          sed -i 's/platforms;android-37.0/platforms;android-37/g' "$ANDROID_HOME/platforms/android-37/package.xml" 2>/dev/null || true
          sed -i 's/AndroidVersion.ApiLevel=37.0/AndroidVersion.ApiLevel=37/g' "$ANDROID_HOME/platforms/android-37/source.properties" 2>/dev/null || true
        fi
        mkdir -p "$ANDROID_HOME/tools/support"
        python3 -c "import zipfile; zipfile.ZipFile('$ANDROID_HOME/tools/support/annotations.jar', 'w').close()"

    - name: Write key
      run: |
        if [ ! -z "${{ secrets.SIGNING_KEY }}" ]; then
          echo KEYSTORE_PASSWORD='${{ secrets.KEYSTORE_PASSWORD }}' >> local.properties
          echo KEYSTORE_ALIAS='${{ secrets.KEYSTORE_ALIAS }}' >> local.properties
          echo KEY_PASSWORD='${{ secrets.KEY_PASSWORD }}' >> local.properties
          echo KEY_LOCATE='../release.keystore' >> local.properties
          echo ${{ secrets.SIGNING_KEY }} | base64 --decode > release.keystore
        fi

    - name: Determine Version Name
      id: ghd
      run: |
        SHA=$(git rev-parse HEAD)
        SHORT_SHA=$(git rev-parse --short HEAD)
        DESCRIBE=$(git describe --tags --always 2>/dev/null || true)
        if [ -z "$DESCRIBE" ] || [ "$DESCRIBE" = "$SHORT_SHA" ]; then
          COUNT=$(git rev-list --count HEAD 2>/dev/null || echo "0")
          DESCRIBE="v1.0.${COUNT}-${SHORT_SHA}"
        fi
        echo "describe=$DESCRIBE" >> $GITHUB_OUTPUT
        echo "sha=$SHA" >> $GITHUB_OUTPUT
        echo "Calculated version: $DESCRIBE"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew assemble test -P versionName=${{ steps.ghd.outputs.describe }}



    - name: Collect artifact name
      run: |
        for variant in vc105 normal; do
          for build_type in debug release; do
            artifact_name=$(basename -s .apk push/build/outputs/apk/$variant/$build_type/*.apk)
            echo "${variant}_${build_type}_artifact=$artifact_name" >> $GITHUB_ENV
          done
        done

    - name: Upload Release For Normal
      uses: actions/upload-artifact@v4.6.0
      with:
        name: ${{ env.normal_release_artifact }}
        path: push/build/outputs/apk/normal/release/*.apk

    - name: Upload Release For VC105
      uses: actions/upload-artifact@v4.6.0
      with:
        name: ${{ env.vc105_release_artifact }}
        path: push/build/outputs/apk/vc105/release/*.apk

    - name: Upload Debug For Normal
      uses: actions/upload-artifact@v4.6.0
      with:
        name: ${{ env.normal_debug_artifact }}
        path: push/build/outputs/apk/normal/debug/*.apk

    - name: Upload Debug For VC105
      uses: actions/upload-artifact@v4.6.0
      with:
        name: ${{ env.vc105_debug_artifact }}
        path: push/build/outputs/apk/vc105/debug/*.apk

    - name: Get Version Name
      id: gvn
      run: |
        artifact_name=(push/build/outputs/apk/*/*/*.apk)
        version=$(echo $artifact_name | sed 's/.*(v.*)(-[^-]+){2}/\1/' -r)
        echo "version=$version" >> $GITHUB_OUTPUT

    - name: Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        name: ${{ steps.gvn.outputs.version }}
        tag_name: ${{ steps.gvn.outputs.version }}
        target_commitish: ${{ steps.ghd.outputs.sha }}
        prerelease: true
        files: push/build/outputs/apk/*/*/*.apk

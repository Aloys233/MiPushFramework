name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK Platform 37
      run: |
        export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
        SDKMANAGER=$(which sdkmanager 2>/dev/null || find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n 1)
        if [ -z "$SDKMANAGER" ]; then
          echo "sdkmanager not found in $ANDROID_HOME"
          exit 1
        fi
        echo "Using sdkmanager: $SDKMANAGER"
        yes | "$SDKMANAGER" --licenses 2>/dev/null || true
        "$SDKMANAGER" "platforms;android-37.0"
        if [ -d "$ANDROID_HOME/platforms/android-37.0" ]; then
          rm -rf "$ANDROID_HOME/platforms/android-37"
          mv "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          sed -i 's/platforms;android-37.0/platforms;android-37/g' "$ANDROID_HOME/platforms/android-37/package.xml" 2>/dev/null || true
          sed -i 's/AndroidVersion.ApiLevel=37.0/AndroidVersion.ApiLevel=37/g' "$ANDROID_HOME/platforms/android-37/source.properties" 2>/dev/null || true
        fi
        mkdir -p "$ANDROID_HOME/tools/support"
        python3 -c "import zipfile; zipfile.ZipFile('$ANDROID_HOME/tools/support/annotations.jar', 'w').close()"

    - name: Write key
      run: |
        if [ ! -z "${{ secrets.SIGNING_KEY }}" ]; then
          echo KEYSTORE_PASSWORD='${{ secrets.KEYSTORE_PASSWORD }}' >> local.properties
          echo KEYSTORE_ALIAS='${{ secrets.KEYSTORE_ALIAS }}' >> local.properties
          echo KEY_PASSWORD='${{ secrets.KEY_PASSWORD }}' >> local.properties
          echo KEY_LOCATE='../release.keystore' >> local.properties
          echo ${{ secrets.SIGNING_KEY }} | base64 --decode > release.keystore
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleNormalRelease test -P versionName=${{ github.ref_name }}

    - name: Package KernelSU Module
      run: |
        TAG="${{ github.ref_name }}"
        APK_FILE=$(find push/build/outputs/apk/normal/release/ -name "*.apk" | head -n 1)
        if [ -z "$APK_FILE" ]; then
          echo "APK file not found!"
          exit 1
        fi
        echo "Found APK: $APK_FILE"

        MODULE_DIR="build/ksu_module"
        rm -rf "$MODULE_DIR"
        mkdir -p "$MODULE_DIR/system/priv-app/com.xiaomi.xmsf"
        mkdir -p "$MODULE_DIR/system/etc/permissions"

        cp "$APK_FILE" "$MODULE_DIR/system/priv-app/com.xiaomi.xmsf/com.xiaomi.xmsf.apk"

        cat << 'EOF' > "$MODULE_DIR/system/etc/permissions/privapp-permissions-com.xiaomi.xmsf.xml"
<?xml version="1.0" encoding="utf-8"?>
<permissions>
    <privapp-permissions package="com.xiaomi.xmsf">
    </privapp-permissions>
</permissions>
EOF

        REV_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo "100")
        cat << EOF > "$MODULE_DIR/module.prop"
id=mipush_framework_system
name=MiPush Framework (System App)
version=${TAG}
versionCode=${REV_COUNT}
author=Aloys23
description=将 MiPushFramework (com.xiaomi.xmsf) 作为系统特权应用 (priv-app) 挂载并自动安装，支持 Android 11+ 包可见性限制与离线推送通道。
EOF

        cat << 'EOF' > "$MODULE_DIR/customize.sh"
SKIPUNZIP=0

ui_print "****************************************"
ui_print "  MiPush Framework (System App) 模块   "
ui_print "****************************************"

ui_print "- 正在配置系统特权应用权限..."
set_perm_recursive "$MODPATH" 0 0 0755 0644
set_perm_recursive "$MODPATH/system/priv-app" 0 0 0755 0644
set_perm_recursive "$MODPATH/system/etc" 0 0 0755 0644

APK_PATH="$MODPATH/system/priv-app/com.xiaomi.xmsf/com.xiaomi.xmsf.apk"
if [ -f "$APK_PATH" ]; then
    ui_print "- 正在自动安装应用 (pm install)..."
    pm install -r -d "$APK_PATH" 2>&1 | while read -r line; do
        ui_print "  $line"
    done
fi

ui_print "- 正在配置电池优化白名单..."
dumpsys deviceidle whitelist +com.xiaomi.xmsf 2>/dev/null || true

ui_print "****************************************"
ui_print " 安装成功！"
ui_print " 重启手机后将完全生效为系统特权应用喵~"
ui_print "****************************************"
EOF

        ZIP_NAME="MiPushFramework-${TAG}-ksu-module.zip"
        (cd "$MODULE_DIR" && zip -r "../../$ZIP_NAME" ./*)
        echo "KSU_MODULE_ZIP=$ZIP_NAME" >> $GITHUB_ENV

    - name: Publish APK to Release
      # 直接在 Release 里附上原始 .apk 和 KSU 模块 zip
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG="${{ github.ref_name }}"
        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release edit "$TAG" --title "$TAG"
        else
          gh release create "$TAG" --title "$TAG" --notes "MiPushFramework $TAG" --verify-tag
        fi
        gh release upload "$TAG" push/build/outputs/apk/normal/release/*.apk "$KSU_MODULE_ZIP" --clobber


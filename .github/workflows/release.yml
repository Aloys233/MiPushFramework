name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK Platform 37
      run: |
        export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
        SDKMANAGER=$(which sdkmanager 2>/dev/null || find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n 1)
        if [ -z "$SDKMANAGER" ]; then
          echo "sdkmanager not found in $ANDROID_HOME"
          exit 1
        fi
        echo "Using sdkmanager: $SDKMANAGER"
        yes | "$SDKMANAGER" --licenses 2>/dev/null || true
        "$SDKMANAGER" "platforms;android-37.0"
        if [ -d "$ANDROID_HOME/platforms/android-37.0" ]; then
          rm -rf "$ANDROID_HOME/platforms/android-37"
          mv "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          sed -i 's/platforms;android-37.0/platforms;android-37/g' "$ANDROID_HOME/platforms/android-37/package.xml" 2>/dev/null || true
          sed -i 's/AndroidVersion.ApiLevel=37.0/AndroidVersion.ApiLevel=37/g' "$ANDROID_HOME/platforms/android-37/source.properties" 2>/dev/null || true
        fi
        mkdir -p "$ANDROID_HOME/tools/support"
        python3 -c "import zipfile; zipfile.ZipFile('$ANDROID_HOME/tools/support/annotations.jar', 'w').close()"

    - name: Write key
      run: |
        if [ ! -z "${{ secrets.SIGNING_KEY }}" ]; then
          echo KEYSTORE_PASSWORD='${{ secrets.KEYSTORE_PASSWORD }}' >> local.properties
          echo KEYSTORE_ALIAS='${{ secrets.KEYSTORE_ALIAS }}' >> local.properties
          echo KEY_PASSWORD='${{ secrets.KEY_PASSWORD }}' >> local.properties
          echo KEY_LOCATE='../release.keystore' >> local.properties
          echo ${{ secrets.SIGNING_KEY }} | base64 --decode > release.keystore
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleNormalRelease test -P versionName=${{ github.ref_name }}

    - name: Package KernelSU Module
      run: |
        chmod +x build_scripts/package_ksu_module.sh
        build_scripts/package_ksu_module.sh "${{ github.ref_name }}"

    - name: Publish APK to Release
      # 直接在 Release 里附上原始 .apk 和 KSU 模块 zip
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG="${{ github.ref_name }}"
        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release edit "$TAG" --title "$TAG"
        else
          gh release create "$TAG" --title "$TAG" --notes "MiPushFramework $TAG" --verify-tag
        fi
        gh release upload "$TAG" push/build/outputs/apk/normal/release/*.apk "$KSU_MODULE_ZIP" --clobber


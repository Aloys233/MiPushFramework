// 控制器和服务程序共享的 Common Lib

apply plugin: 'com.android.library'

android {
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField ('String', 'PUSH_VERSION_CODE', '\"' + rootProject.ext.pushVersionCode + '\"')
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lintOptions {
        abortOnError false
    }
    namespace 'top.trumeet.common'
}

// Framework 桩类(android.app.ActivityManager / AppGlobals / AppOpsManager)必须作为源码
// 参与编译才能覆盖 android.jar(编译期用其隐藏 API),但绝不能进入产物,否则会与平台类同名。
// 注意 AppOpsManagerExtender 是真实功能类,必须保留(它依赖与 AppOpsManager 同包才能编译)。
android.libraryVariants.all { variant ->
    def cap = variant.name.capitalize()
    def javacClasses = layout.buildDirectory.dir(
            "intermediates/javac/${variant.name}/compile${cap}JavaWithJavac/classes")
    def stripStubs = tasks.register("strip${cap}StubClasses") {
        dependsOn "compile${cap}JavaWithJavac"
        outputs.upToDateWhen { false }
        doLast {
            def appDir = new File(javacClasses.get().asFile, 'android/app')
            if (appDir.exists()) {
                delete fileTree(dir: appDir, include: [
                        'ActivityManager*.class',
                        'AppGlobals*.class',
                        'AppOpsManager.class',
                        'AppOpsManager$*.class'
                ])
            }
        }
    }
    tasks.matching { it.name.startsWith('bundleLib') && it.name.endsWith(cap) }
            .configureEach { dependsOn stripStubs }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.0.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
}

// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '2.0.21'

    repositories {
        if (!System.getenv("CI")) {
            maven { url = uri("https://maven.aliyun.com/repository/central") }
            maven { url = uri("https://maven.aliyun.com/repository/public") }
            maven { url = uri("https://maven.aliyun.com/repository/gradle-plugin") }
            maven { url = uri("https://maven.aliyun.com/repository/google") }
        }

        google()
        mavenCentral()
        maven { url = uri("https://jitpack.io") }
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.8.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version"
        classpath 'org.aspectj:aspectjtools:1.9.22.1'
        classpath 'org.aspectj:aspectjrt:1.9.22.1'
    }

}

allprojects {
    repositories {
        if (!System.getenv("CI")) {
            maven { url = uri("https://maven.aliyun.com/repository/central") }
            maven { url = uri("https://maven.aliyun.com/repository/public") }
            maven { url = uri("https://maven.aliyun.com/repository/gradle-plugin") }
            maven { url = uri("https://maven.aliyun.com/repository/google") }
        }

        google()
        mavenCentral()
        maven { url = uri("https://jitpack.io") }
        gradlePluginPortal()
    }

    gradle.taskGraph.whenReady {
        tasks.each { task ->
            if (task.name.equals('mockableAndroidJar')) {
                task.enabled = false
            }
        }
    }

    tasks.matching { it.name.contains("AarMetadata") }.configureEach {
        enabled = false
    }
}

task clean(type: Delete) {
    delete rootProject.layout.buildDirectory
}

def releaseTime() {
    return new Date().format("yyyyMMdd", TimeZone.getTimeZone("UTC"))
}

def getVersionCode = { ->
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-list', '--first-parent', '--count', 'HEAD'
            standardOutput = stdout
        }
        return Integer.parseInt(stdout.toString().trim())
    } catch (ignored) {
        return -1;
    }
}

def getVersionName = { ->
    String versionName  = project.findProperty('versionName') ?: getVersionNameFromGit() ?: "1.0.0"
    versionName = increaseVersionForPreRelease(versionName)
    return versionName.replaceFirst("^v", "")
}

private static String increaseVersionForPreRelease(String versionName) {
    if (isPreReleaseVersion(versionName)) {
        return versionName.replaceFirst("(\\d+\\.\\d+\\.)(\\d+)", {
            return it[1] + (it[2].toInteger() + 1)
        })
    }
    return versionName
}

private static boolean isPreReleaseVersion(String versionName) {
    versionName.contains('-')
}

// 语义化 versionCode:1003000000 + major*10000 + minor*100 + patch
// 基数 1003000000 远大于小米 SDK 要求的 106,保证兼容判断走新分支;
// 同时随版本单调递增,便于设备覆盖安装/升级。
static int versionCodeFromName(String versionName) {
    def m = versionName =~ /(\d+)\.(\d+)(?:\.(\d+))?/
    if (!m.find()) {
        return 1003000000 + 10000   // 无法解析时回退到 1.0.0
    }
    int major = (m.group(1) ?: 0) as int
    int minor = (m.group(2) ?: 0) as int
    int patch = (m.group(3) ?: 0) as int
    return 1003000000 + major * 10000 + minor * 100 + patch
}

private String getVersionNameFromGit() {
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            // v0.3.10-187-gef4be8c9-dirty
            commandLine 'git', 'describe', '--tags', '--dirty', '--exclude', 'v*-*'
            standardOutput = stdout
        }
        return stdout.toString().trim()
    } catch (ignored) {
        return null
    }
}

ext {
    minSdkVersion = 33
    compileSdkVersion = 37
    targetSdkVersion = 37
    pushVersionCode = 7

    gitVersionCode = getVersionCode()
    gitVersionName = getVersionName()
    snapshot = false
    versionBase = gitVersionName
    versionName = snapshot ? versionBase + "-SNAPSHOT" : versionBase
    appVersionCode = versionCodeFromName(versionName)
    gitTag = versionName

    // Work
    work_version = "1.0.0-alpha05"
}

task exportVersion(type: Exec) {
    commandLine 'sh'
    doLast {
        file("$projectDir/version.txt").text = """$versionName"""
        file("$projectDir/gitTag.txt").text = """$gitTag"""
    }
}

task weaveMiPushHook {
    doLast {
        def androidHome = System.getenv("ANDROID_HOME") ?: project.findProperty("sdk.dir") ?: "/home/luodh/Android/Sdk"
        def androidJar = file("${androidHome}/platforms/android-34/android.jar")
        if (!androidJar.exists()) {
            androidJar = file("${androidHome}/platforms/android-37.0/android.jar")
        }
        def inJar = file("mipush_hook/libs/miuipushsdkshared_3_7_9.jar")
        def outJar = file("mipush_hook/libs/miuipushsdkshared_3_7_9_hooked.jar")
        def srcDir = file("mipush_hook/src/main/java")

        // 动态解析 ajc 和编译所需依赖
        def ajcToolConfig = configurations.detachedConfiguration(
            dependencies.create('org.aspectj:aspectjtools:1.9.22.1')
        )
        def ajcClasspathConfig = configurations.detachedConfiguration(
            dependencies.create('org.aspectj:aspectjrt:1.9.22.1'),
            dependencies.create('androidx.annotation:annotation:1.8.0'),
            dependencies.create('androidx.startup:startup-runtime:1.1.1')
        )

        def resolvedJars = []
        ajcClasspathConfig.files.each { f ->
            if (f.name.endsWith('.aar')) {
                def extractedJar = file("${layout.buildDirectory.get().asFile}/tmp/aar_jars/${f.name}.jar")
                extractedJar.parentFile.mkdirs()
                if (!extractedJar.exists() || extractedJar.lastModified() < f.lastModified()) {
                    new java.util.zip.ZipFile(f).withCloseable { zip ->
                        def entry = zip.getEntry("classes.jar")
                        if (entry) {
                            zip.getInputStream(entry).withCloseable { is ->
                                extractedJar.withOutputStream { os -> os << is }
                            }
                        }
                    }
                }
                resolvedJars.add(extractedJar)
            } else {
                resolvedJars.add(f)
            }
        }

        def cpFiles = resolvedJars + [androidJar, inJar]
        def cpStr = cpFiles.collect { it.absolutePath }.join(File.pathSeparator)

        println "Starting native AspectJ Compiler (ajc) weaving..."
        println "Input Jar: ${inJar.absolutePath}"
        println "Output Jar: ${outJar.absolutePath}"
        println "Source Dir: ${srcDir.absolutePath}"

        def tempOutJar = file("mipush_hook/libs/temp_woven.jar")
        if (tempOutJar.exists()) tempOutJar.delete()

        def stdout = new ByteArrayOutputStream()
        def stderr = new ByteArrayOutputStream()

        def result = javaexec {
            classpath = ajcToolConfig
            mainClass = 'org.aspectj.tools.ajc.Main'
            args = [
                '-1.8',
                '-inpath', inJar.absolutePath,
                '-sourceroots', srcDir.absolutePath,
                '-cp', cpStr,
                '-outjar', tempOutJar.absolutePath,
                '-nowarn',
                '-Xlint:ignore'
            ]
            standardOutput = stdout
            errorOutput = stderr
            ignoreExitValue = true
        }

        println stdout.toString()
        if (stderr.size() > 0) {
            System.err.println stderr.toString()
        }

        if (result.exitValue != 0) {
            throw new GradleException("AJC weaving failed with code " + result.exitValue)
        }

        // 获取原 jar 中的所有条目名称集合
        def originalEntries = new HashSet<String>()
        new java.util.zip.ZipFile(inJar).withCloseable { zip ->
            def entries = zip.entries()
            while (entries.hasMoreElements()) {
                originalEntries.add(entries.nextElement().name)
            }
        }

        def urls = cpFiles.collect { it.toURI().toURL() } as URL[]
        def urlLoader = new URLClassLoader(urls, Thread.currentThread().getContextClassLoader())

        def enableAsmRewrite = true

        // tempOutJar 同时包含:
        //   1) 被 AspectJ 织入的 SDK 类(原 jar 的条目)
        //   2) 由 ajc 编译的切面类(com/nihility/**、com/xiaomi/**、Hook 等)
        // 二者都要保留:切面类必须由 ajc 编译,才会生成 aspectOf()/hasAspect() 及 advice 派发代码,
        // 否则被织入的 SDK 在运行时会抛 NoSuchMethodError: MethodHooker.aspectOf()。
        // 仅对 SDK 类做 ASM 重算 StackMapTable 以兼容 Java 21,切面类原样拷贝。
        if (outJar.exists()) outJar.delete()
        new java.util.zip.ZipOutputStream(new FileOutputStream(outJar)).withCloseable { zos ->
            new java.util.zip.ZipFile(tempOutJar).withCloseable { tempZip ->
                def entries = tempZip.entries()
                while (entries.hasMoreElements()) {
                    def entry = entries.nextElement()
                    if (!entry.isDirectory()) {
                        def newEntry = new java.util.zip.ZipEntry(entry.name)
                        newEntry.time = entry.time
                        zos.putNextEntry(newEntry)
                        if (enableAsmRewrite && entry.name.endsWith(".class") && originalEntries.contains(entry.name)) {
                            byte[] rawBytes = tempZip.getInputStream(entry).bytes
                            try {
                                def reader = new org.objectweb.asm.ClassReader(rawBytes)
                                def writer = new org.objectweb.asm.ClassWriter(org.objectweb.asm.ClassWriter.COMPUTE_FRAMES) {
                                    @Override
                                    protected String getCommonSuperClass(String type1, String type2) {
                                        try {
                                            Class<?> c1 = Class.forName(type1.replace('/', '.'), false, urlLoader)
                                            Class<?> c2 = Class.forName(type2.replace('/', '.'), false, urlLoader)
                                            if (c1.isAssignableFrom(c2)) return type1
                                            if (c2.isAssignableFrom(c1)) return type2
                                            if (c1.isInterface() || c2.isInterface()) return "java/lang/Object"
                                            do {
                                                c1 = c1.getSuperclass()
                                            } while (!c1.isAssignableFrom(c2))
                                            return c1.getName().replace('.', '/')
                                        } catch (Throwable ignored) {
                                            return "java/lang/Object"
                                        }
                                    }
                                }
                                reader.accept(writer, org.objectweb.asm.ClassReader.SKIP_FRAMES)
                                zos.write(writer.toByteArray())
                            } catch (Throwable t) {
                                zos.write(rawBytes)
                            }
                        } else {
                            tempZip.getInputStream(entry).withCloseable { is ->
                                zos << is
                            }
                        }
                        zos.closeEntry()
                    }
                }
            }
        }
        tempOutJar.delete()

        println "Native AJC weaving & StackMapTable generation completed successfully!"
        println "Woven Jar generated: ${outJar.absolutePath} (size: ${outJar.length()} bytes)"
    }
}
